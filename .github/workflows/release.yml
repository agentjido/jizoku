name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      operation:
        description: "Release operation: auto, prepare, or publish"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - prepare
          - publish
      tag_name:
        description: "Optional v-prefixed tag for publish simulation"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (no git push, no tag, no GitHub release, no Hex publish)"
        required: false
        type: boolean
        default: false
      hex_dry_run:
        description: "Hex dry run only (run all git/release steps, but skip actual Hex publish)"
        required: false
        type: boolean
        default: false
      skip_tests:
        description: "Skip tests before release"
        required: false
        type: boolean
        default: false
      version_override:
        description: "Optional bare SemVer override (for example 1.2.3, not v1.2.3)"
        required: false
        type: string
        default: ""

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Release
    if: >-
      ${{
        inputs.dry_run == true ||
        vars.JIZOKU_RELEASES_ENABLED == 'true'
      }}
    uses: agentjido/github-actions/.github/workflows/jido-release.yml@v5
    with:
      operation: ${{ inputs.operation || 'auto' }}
      tag_name: ${{ inputs.tag_name || '' }}
      dry_run: ${{ inputs.dry_run || false }}
      hex_dry_run: ${{ inputs.hex_dry_run || false }}
      skip_tests: ${{ inputs.skip_tests || false }}
      version_override: ${{ inputs.version_override || '' }}
      preflight_command: >-
        docker run --detach --rm --name jizoku-release-postgres
        --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=postgres
        --publish 5432:5432 postgres:17 &&
        until docker exec jizoku-release-postgres pg_isready -U postgres;
        do sleep 1; done &&
        mix deps.audit --ignore-file config/deps_audit.ignore &&
        DATABASE_URL=postgres://postgres:postgres@localhost:5432/jizoku_test
        MIX_ENV=test mix test
    secrets: inherit
