name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v4
    secrets: inherit
    with:
      # Elixir 1.20 reports warnings in transitive dependencies. Keep it visible
      # as an experimental lane until upstream packages are warning-clean.
      quality_otp_version: "28"
      quality_elixir_version: "1.19"
      otp_versions: '["27", "28"]'
      elixir_versions: '["1.18", "1.19"]'
      experimental_compile_otp_versions: '["28"]'
      experimental_compile_elixir_versions: '["1.20.2"]'
      experimental_compile_otp_name: "28"
      test_setup_command: >-
        docker run --detach --rm --name jizoku-postgres
        --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=postgres
        --publish 5432:5432 postgres:17 &&
        until docker exec jizoku-postgres pg_isready -U postgres;
        do sleep 1; done
      test_command: mix coveralls
      audit_command: mix deps.audit --ignore-file config/deps_audit.ignore
      docs_command: mix docs -f html
