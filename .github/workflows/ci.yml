name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v5
    secrets: inherit
    with:
      audit_command: mix deps.audit --ignore-file config/deps_audit.ignore
      docs_command: mix doctor --raise && mix docs -f html
      test_setup_command: >-
        docker run --detach --rm --name jizoku-postgres
        --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=postgres
        --publish 5432:5432 postgres:17 &&
        until docker exec jizoku-postgres pg_isready -U postgres;
        do sleep 1; done
      test_command: mix coveralls

  package-checks:
    name: Jizoku Package Checks
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check Discord notification formatting
        run: bash .github/tests/discord_notifications_test.sh

      - name: Setup Elixir
        uses: ./.github/actions/setup-elixir
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Run package-specific quality gates
        run: |
          mix xref graph --format cycles --label compile-connected --fail-above 0
          mix brand.audit
          mix quality_gates

  example-host-app:
    name: Example Host App
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: examples/minimal_host_app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: |
            examples/minimal_host_app/deps
            examples/minimal_host_app/_build
          key: ${{ runner.os }}-example-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('examples/minimal_host_app/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-example-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Run tests
        run: mix test

      - name: Run smoke path
        run: MIX_ENV=test mix example.smoke

      - name: Verify operational commands
        run: MIX_ENV=test mix example.operations

  bedrock-example-host-app:
    name: Bedrock Example Host App
    runs-on: ubuntu-24.04
    # Bedrock 0.5.2 does not run on OTP 29. Keep this package-specific
    # integration on its established runtime until Bedrock adds support.
    env:
      ELIXIR_VERSION: "1.19.5"
      OTP_VERSION: "28.4.1"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: examples/bedrock_minimal_host_app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: |
            examples/bedrock_minimal_host_app/deps
            examples/bedrock_minimal_host_app/_build
          key: ${{ runner.os }}-bedrock-example-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('examples/bedrock_minimal_host_app/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-bedrock-example-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Postgres
        run: until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Start Erlang port mapper
        run: epmd -daemon

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run Bedrock stress coverage
        run: MIX_ENV=test mix test test/bedrock_job_queue_stress_test.exs test/bedrock_multi_node_consumer_test.exs
