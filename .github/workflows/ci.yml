name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v4
    secrets: inherit
    with:
      test_matrix: '[{"otp":"27","elixir":"1.18"},{"otp":"28","elixir":"1.18"},{"otp":"28","elixir":"1.19"},{"otp":"29","elixir":"1.20"}]'
      test_command: mix coveralls
      audit_command: mix deps.audit --ignore-file config/deps_audit.ignore
      docs_command: mix docs -f html
