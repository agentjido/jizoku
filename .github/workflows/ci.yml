name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  ci:
    name: CI
    uses: agentjido/github-actions/.github/workflows/jido-ci.yml@v4
    secrets: inherit
    with:
      quality_otp_version: "29"
      quality_elixir_version: "1.20"
      otp_versions: '["27", "28"]'
      elixir_versions: '["1.18", "1.19", "1.20"]'
      test_command: mix coveralls
      audit_command: mix deps.audit --ignore-file config/deps_audit.ignore
      docs_command: mix docs -f html
