version: 2

updates:
  - package-ecosystem: "mix"
    directories:
      - "/"
      - "/examples/minimal_host_app"
      - "/examples/bedrock_minimal_host_app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 5
    target-branch: "main"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5
    target-branch: "main"
